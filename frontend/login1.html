<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="box1">
        <div class="box11">

            <img src="ajc logo.png" class="box12">
            <h1 style="text-align:center; margin:10px">Login</h1>
        </div>

        <div class="l11">
            <label class="l1">Email</label>
            <input type="text" placeholder="Enter Email" class="email1">
            <label class="l2">Password</label>
            <input type="password" placeholder="Enter password" class="pass1">
        </div>

        <button class="reg">Login</button>
        <h3>------------OR------------</h3>

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px">

                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />

        <p>Create a Account <a href="index.html">Register</a></p>
    </div>

</html>
